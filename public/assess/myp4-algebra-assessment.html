<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYP4 Algebra Assessment - 25 Questions | KaniMath</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --primary-dark: #4f46e5; --primary-light: #818cf8; --secondary: #10b981; --danger: #ef4444; --warning: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b; --bg-hover: #334155; --bg-section: #0a0f1a; --text-primary: #f8fafc; --text-secondary: #94a3b8; --text-muted: #64748b; --border: #475569; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-primary); min-height: 100vh; }
        .app-container { display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--bg-card); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; }
        .logo { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .logo-icon { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--secondary)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; }
        .logo-text h1 { font-size: 14px; font-weight: 600; }
        .logo-text span { font-size: 11px; color: var(--text-secondary); }
        .timer-container { background: rgba(99, 102, 241, 0.1); border: 1px solid var(--primary); border-radius: 12px; padding: 16px; margin-bottom: 20px; text-align: center; }
        .timer-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        .timer { font-size: 32px; font-weight: 700; font-family: 'Fira Code', monospace; color: var(--primary); }
        .timer.warning { color: var(--warning); animation: pulse 1s infinite; }
        .timer.danger { color: var(--danger); }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .progress-section { margin-bottom: 20px; }
        .progress-text { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 8px; color: var(--text-secondary); }
        .progress-bar { height: 8px; background: var(--bg-section); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), var(--secondary)); transition: width 0.3s ease; }
        .nav-label { font-size: 12px; color: var(--text-secondary); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 1px; }
        .question-nav { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 20px; }
        .nav-btn { aspect-ratio: 1; border: 2px solid var(--border); background: var(--bg-section); border-radius: 8px; color: var(--text-secondary); font-weight: 600; font-size: 13px; cursor: pointer; transition: all 0.2s; }
        .nav-btn:hover { background: var(--bg-hover); border-color: var(--primary); }
        .nav-btn.current { background: var(--primary); border-color: var(--primary); color: white; }
        .nav-btn.answered { background: var(--secondary); border-color: var(--secondary); color: white; }
        .controls { margin-top: auto; display: flex; flex-direction: column; gap: 10px; }
        .btn { padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg-section); color: var(--text-primary); font-size: 14px; cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif; font-weight: 500; text-align: center; }
        .btn:hover { border-color: var(--primary); background: var(--bg-hover); }
        .btn-primary { background: var(--primary); border-color: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-dark); }
        .btn-danger { background: rgba(239, 68, 68, 0.1); border-color: var(--danger); color: var(--danger); }
        .main-content { flex: 1; margin-left: 280px; padding: 40px; max-width: 900px; }
        .quiz-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
        .quiz-title h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; }
        .quiz-title p { font-size: 14px; color: var(--text-secondary); }
        .badge { padding: 6px 16px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-myp4 { background: rgba(99, 102, 241, 0.2); color: var(--primary-light); border: 1px solid rgba(99, 102, 241, 0.3); }
        .question-container { margin-bottom: 40px; }
        .question-header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
        .question-number { width: 40px; height: 40px; background: linear-gradient(135deg, var(--primary), var(--primary-dark)); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; }
        .question-meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .difficulty-dots span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--border); margin-right: 3px; }
        .difficulty-dots span.active { background: var(--warning); }
        .topic-tag { padding: 4px 10px; background: rgba(99, 102, 241, 0.1); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 6px; font-size: 11px; color: var(--primary-light); }
        .question-text { font-size: 16px; line-height: 1.8; margin-bottom: 20px; color: var(--text-primary); }
        .question-diagram { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin: 20px 0; text-align: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .option-btn { padding: 16px 20px; background: var(--bg-card); border: 2px solid var(--border); border-radius: 12px; color: var(--text-primary); font-size: 15px; cursor: pointer; transition: all 0.2s; text-align: left; font-family: 'Inter', sans-serif; }
        .option-btn:hover { border-color: var(--primary); background: var(--bg-hover); }
        .option-btn.selected { border-color: var(--primary); background: rgba(99, 102, 241, 0.1); }
        .option-btn.correct { border-color: var(--secondary); background: rgba(16, 185, 129, 0.1); }
        .option-btn.incorrect { border-color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .option-label { display: inline-block; width: 30px; height: 30px; background: var(--bg-section); border-radius: 8px; text-align: center; line-height: 30px; font-weight: 600; margin-right: 12px; }
        .option-btn.selected .option-label { background: var(--primary); color: white; }
        .option-btn.correct .option-label { background: var(--secondary); color: white; }
        .option-btn.incorrect .option-label { background: var(--danger); color: white; }
        .explanation { background: rgba(99, 102, 241, 0.05); border: 1px solid rgba(99, 102, 241, 0.2); border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
        .explanation.show { display: block; }
        .explanation h4 { color: var(--primary-light); margin-bottom: 10px; font-size: 14px; }
        .explanation p { color: var(--text-secondary); font-size: 14px; line-height: 1.7; }
        .question-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--border); }
        .result-screen { text-align: center; padding: 60px 20px; display: none; }
        .result-screen.show { display: block; }
        .result-icon { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 48px; margin: 0 auto 30px; }
        .result-icon.excellent { background: rgba(16, 185, 129, 0.1); border: 2px solid var(--secondary); }
        .result-icon.good { background: rgba(99, 102, 241, 0.1); border: 2px solid(var(--primary)); }
        .result-icon.needs-work { background: rgba(245, 158, 11, 0.1); border: 2px solid var(--warning); }
        .result-score { font-size: 64px; font-weight: 800; margin-bottom: 10px; }
        .result-score.excellent { color: var(--secondary); }
        .result-score.good { color: var(--primary); }
        .result-score.needs-work { color: var(--warning); }
        .result-details { color: var(--text-secondary); margin-bottom: 30px; }
        .result-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin: 30px 0; }
        .stat-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-value { font-size: 28px; font-weight: 700; color: var(--primary-light); }
        .stat-label { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
        @media (max-width: 1024px) { .sidebar { width: 100%; height: auto; position: relative; } .main-content { margin-left: 0; padding: 20px; } .app-container { flex-direction: column; } }
        @media (max-width: 768px) { .options-grid { grid-template-columns: 1fr; } .result-stats { grid-template-columns: repeat(2, 1fr); } }
        .review-section { margin-top: 30px; }
        .review-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 15px; }
        .review-item.correct { border-left: 4px solid var(--secondary); }
        .review-item.incorrect { border-left: 4px solid var(--danger); }
    </style>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon">K</div>
                <div class="logo-text"><h1><a href="/" style="color:inherit;text-decoration:none;">KaniMath</a></h1><span>Algebra Quiz</span></div>
            </div>
            <a href="/" class="btn" style="margin-bottom:20px;display:block;text-align:center;">← Back to Home</a>
            <div class="timer-container"><div class="timer-label">Time Remaining</div><div class="timer" id="timer">60:00</div></div>
            <div class="progress-section">
                <div class="progress-text"><span>Progress</span><span id="progress-text">0/25</span></div>
                <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
            </div>
            <div class="nav-label">Question Navigator</div>
            <div class="question-nav" id="question-nav"></div>
            <div class="controls">
                <button class="btn btn-primary" onclick="submitQuiz()">Submit Quiz</button>
                <button class="btn" onclick="reviewAnswers()">Review</button>
                <button class="btn btn-danger" onclick="exitQuiz()">Exit</button>
            </div>
        </aside>
        <main class="main-content">
            <div id="quiz-screen">
                <div class="quiz-header">
                    <div class="quiz-title"><h1>Algebra Assessment</h1><p>25 Questions • 60 Minutes • Based on Haese MYP4</p></div>
                    <span class="badge badge-myp4">MYP4</span>
                </div>
                <div id="question-display"></div>
            </div>
            <div class="result-screen" id="result-screen">
                <div class="result-icon excellent" id="result-icon"><span>🎉</span></div>
                <div class="result-score excellent" id="result-score">0%</div>
                <div class="result-details" id="result-details">You answered 0 out of 25 correctly.</div>
                <div class="result-stats">
                    <div class="stat-item"><div class="stat-value" id="stat-correct">0</div><div class="stat-label">Correct</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-incorrect">0</div><div class="stat-label">Incorrect</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-time">0:00</div><div class="stat-label">Time Used</div></div>
                    <div class="stat-item"><div class="stat-value" id="stat-score">0</div><div class="stat-label">Marks</div></div>
                </div>
                <div class="question-actions">
                    <button class="btn btn-primary" onclick="reviewAnswers()">Review Answers</button>
                    <button class="btn" onclick="retakeQuiz()">Retake Quiz</button>
                    <button class="btn" onclick="exitQuiz()">Back to Study</button>
                </div>
                <div class="review-section" id="review-section" style="display:none;"></div>
            </div>
        </main>
    </div>
    <script>
        const questions = [
            // Section 1: Expressions (3 questions)
            {id:1,topic:"Expressions",difficulty:1,text:"Simplify: 3x + 5x - 2x",options:["6x","8x","6x-2","x"],correct:0,explanation:"Combine like terms: 3+5-2=6, so 6x"},
            {id:2,topic:"Expressions",difficulty:1,text:"Expand: 4(2x + 3)",options:["8x+3","8x+12","6x+7","8x+7"],correct:1,explanation:"Use distributive law: 4×2x=8x, 4×3=12"},
            {id:3,topic:"Expressions",difficulty:2,text:"Factor fully: 2x² - 8",options:["2(x²-4)","2(x+2)(x-2)","(x-2)(x+4)","2(x-2)²"],correct:1,explanation:"Take out 2 first: 2(x²-4), then difference of squares: 2(x+2)(x-2)"},

            // Section 2: Linear Equations (4 questions)
            {id:4,topic:"Linear",difficulty:1,text:"Solve: 3x + 7 = 22",options:["x=5","x=15","x=3","x=7"],correct:0,explanation:"3x=22-7=15, x=5"},
            {id:5,topic:"Linear",difficulty:1,text:"Solve: x/4 - 3 = 2",options:["x=20","x=5","x=1","x=-4"],correct:0,explanation:"x/4=5, multiply by 4: x=20"},
            {id:6,topic:"Linear",difficulty:2,text:"Solve: 3(x-2) = 2(x+5)",options:["x=16","x=4","x=-4","x=-16"],correct:0,explanation:"3x-6=2x+10, x=16"},
            {id:7,topic:"Linear",difficulty:2,text:"A train travels 240km at 80km/h. Time taken?",options:["3 hours","2 hours","4 hours","5 hours"],correct:0,explanation:"distance = speed × time, 240 = 80x, x=3"},

            // Section 3: Inequalities (3 questions)
            {id:8,topic:"Inequalities",difficulty:1,text:"Solve: 3x + 2 < 14",options:["x<4","x>4","x<12","x>12"],correct:0,explanation:"3x<12, divide by 3: x<4"},
            {id:9,topic:"Inequalities",difficulty:2,text:"Solve: -2x ≥ 8",options:["x≤-4","x≥-4","x≤4","x≥4"],correct:0,explanation:"Divide by -2, flip sign: x≤-4"},
            {id:10,topic:"Inequalities",difficulty:2,text:"Solve: 5 - 2x > 11",options:["x<-3","x>-3","x<8","x>8"],correct:0,explanation:"-2x>6, divide by -2 and flip: x<-3"},

            // Section 4: Simultaneous Equations (3 questions)
            {id:11,topic:"Simultaneous",difficulty:2,text:"y=2x+1, x+y=7. Solution?",options:["(2,5)","(5,2)","(1,3)","(3,1)"],correct:0,explanation:"Substitute: x+(2x+1)=7, 3x=6, x=2, y=5"},
            {id:12,topic:"Simultaneous",difficulty:2,text:"2x+y=8, x-y=1. Solution?",options:["(3,2)","(2,3)","(4,0)","(1,6)"],correct:0,explanation:"Add equations: 3x=9, x=3, y=2"},
            {id:13,topic:"Simultaneous",difficulty:3,text:"50 tickets sold for $200. Adult $5, child $3. How many adults?",options:["25","30","20","35"],correct:0,explanation:"a+c=50, 5a+3c=200. Solve: a=25, c=25"},

            // Section 5: Quadratic Equations (4 questions)
            {id:14,topic:"Quadratic",difficulty:2,text:"Solve by factoring: x²+5x+6=0",options:["x=-2 or -3","x=2 or 3","x=-2 or 3","x=2 or -3"],correct:0,explanation:"(x+2)(x+3)=0, x=-2 or -3"},
            {id:15,topic:"Quadratic",difficulty:2,text:"Solve: x²-3x-4=0",options:["x=4 or -1","x=4 or 1","x=-4 or 1","x=-4 or -1"],correct:0,explanation:"(x-4)(x+1)=0, x=4 or -1"},
            {id:16,topic:"Quadratic",difficulty:3,text:"Use quadratic formula: x²+x-2=0",options:["x=1 or -2","x=1 or 2","x=-1 or 2","x=-1 or -2"],correct:0,explanation:"x=(-1±√(1+8))/2 = (-1±3)/2, so x=1 or -2"},
            {id:17,topic:"Quadratic",difficulty:3,text:"Discriminant of x²-3x+c=0 is 1. Find c.",options:["c=2","c=1","c=3","c=0"],correct:0,explanation:"D=9-4c=1, -4c=-8, c=2"},

            // Section 6: Functions (3 questions)
            {id:18,topic:"Functions",difficulty:1,text:"f(x)=2x+3. Find f(4).",options:["11","8","14","9"],correct:0,explanation:"f(4)=2(4)+3=8+3=11"},
            {id:19,topic:"Functions",difficulty:2,text:"f(x)=x². What is the domain?",options:["All real numbers","x≥0","x≥2","x≤0"],correct:0,explanation:"x² is defined for all real numbers"},
            {id:20,topic:"Functions",difficulty:3,text:"f(x)=2x+1. Find f⁻¹(x).",options:["(x-1)/2","(x+1)/2","2x-1","x/2-1"],correct:0,explanation:"Let y=2x+1, swap: x=2y+1, solve: y=(x-1)/2"},

            // Section 7: Sequences (3 questions)
            {id:21,topic:"Sequences",difficulty:2,text:"Arithmetic sequence: 5,8,11,14... Find 10th term.",options:["32","30","28","35"],correct:0,explanation:"a₁₀=5+(10-1)3=5+27=32"},
            {id:22,topic:"Sequences",difficulty:2,text:"Geometric sequence: 2,6,18,54... Find 5th term.",options:["162","243","81","120"],correct:0,explanation:"a₅=2×3⁴=2×81=162"},
            {id:23,topic:"Sequences",difficulty:3,text:"Sum of first 5 terms: 3,7,11,15...",options:["75","65","55","85"],correct:2,explanation:"S₅=5(3+19)/2=5×22/2=55 or 3+7+11+15+19=55"},

            // Section 8: Real-World Applications (3 questions)
            {id:24,topic:"Real-World",difficulty:3,text:"Ball thrown: h=30t-5t². When hits ground?",options:["t=6s","t=3s","t=30s","t=5s"],correct:0,explanation:"30t-5t²=0, 5t(6-t)=0, t=6 seconds"},
            {id:25,topic:"Real-World",difficulty:3,text:"$10,000 at 7% compound interest for 10 years. Final amount?",options:["$19,670","$17,000","$24,000","$14,000"],correct:0,explanation:"A=10000(1.07)¹⁰≈10000×1.967=$19,670"}
        ];
        let currentQ=0, answers=new Array(25).fill(null), quizSubmitted=false, timerInterval, timeRemaining=3600;
        function startTimer(){
            timerInterval=setInterval(()=>{timeRemaining--;updateTimerDisplay();if(timeRemaining<=300)document.getElementById('timer').classList.add('warning');if(timeRemaining<=60){document.getElementById('timer').classList.remove('warning');document.getElementById('timer').classList.add('danger');}if(timeRemaining<=0){clearInterval(timerInterval);submitQuiz();}},1000);
        }
        function updateTimerDisplay(){document.getElementById('timer').textContent=Math.floor(timeRemaining/60)+':'+String(timeRemaining%60).padStart(2,'0');}
        function createQuestionNav(){const nav=document.getElementById('question-nav');nav.innerHTML='';questions.forEach((q,i)=>{const btn=document.createElement('button');btn.className='nav-btn';btn.textContent=i+1;btn.onclick=()=>goToQuestion(i);if(i===currentQ)btn.classList.add('current');if(answers[i]!==null)btn.classList.add('answered');nav.appendChild(btn);});}
        function updateProgress(){const answered=answers.filter(a=>a!==null).length;document.getElementById('progress-text').textContent=answered+'/25';document.getElementById('progress-fill').style.width=answered*4+'%';}
        function displayQuestion(index){
            const q=questions[index], display=document.getElementById('question-display');
            const prevTopic = index > 0 ? questions[index-1].topic : null;
            const isNewTopic = q.topic !== prevTopic;
            const topicSection = isNewTopic ? '<div style="background:rgba(99,102,241,0.1);border:2px solid var(--primary);border-radius:12px;padding:15px;margin-bottom:20px;text-align:center;"><div style="font-size:13px;color:var(--primary-light);font-weight:600;">📚 NEW SECTION</div><div style="font-size:18px;font-weight:700;color:white;margin-top:5px;">'+q.topic+'</div></div>' : '';
            display.innerHTML=topicSection+'<div class="question-container"><div class="question-header"><div class="question-number">'+q.id+'</div><div class="question-meta"><div class="difficulty-dots">'+Array(4).fill(0).map((_,i)=>'<span class="'+(i<q.difficulty?'active':'')+'"></span>').join('')+'</div><span class="topic-tag" style="font-size:12px;font-weight:600;padding:5px 12px;">📌 '+q.topic+'</span></div></div><div class="question-text">'+q.text+'</div><div class="options-grid">'+q.options.map((opt,i)=>'<button class="option-btn '+(answers[index]===i?'selected':'')+' '+(quizSubmitted&&i===q.correct?'correct':'')+' '+(quizSubmitted&&answers[index]===i&&i!==q.correct?'incorrect':'')+'" onclick="selectOption('+index+','+i+')" '+(quizSubmitted?'disabled':'')+'><span class="option-label">'+String.fromCharCode(65+i)+'</span><span>'+opt+'</span></button>').join('')+'</div><div class="explanation '+(quizSubmitted&&answers[index]!==q.correct?'show':'')+'"><h4>Explanation:</h4><p>'+q.explanation+'</p></div><div class="question-actions"><button class="btn" onclick="goToQuestion('+(index-1)+')" '+(index===0?'disabled':'')+'>← Previous</button><button class="btn btn-primary" onclick="goToQuestion('+(index+1)+')" '+(index===24?'disabled':'')+'>Next →</button></div></div>';
        }
        function selectOption(qIndex,optIndex){answers[qIndex]=optIndex;createQuestionNav();updateProgress();displayQuestion(qIndex);}
        function goToQuestion(index){if(index>=0&&index<25){currentQ=index;createQuestionNav();displayQuestion(index);}}
        function submitQuiz(){
            if(quizSubmitted)return;
            quizSubmitted=true;
            clearInterval(timerInterval);
            const correct=answers.filter((a,i)=>a===questions[i].correct).length;
            const percent=Math.round(correct/25*100);
            const used=3600-timeRemaining;
            document.getElementById('quiz-screen').style.display='none';
            document.getElementById('result-screen').classList.add('show');
            document.getElementById('result-score').textContent=percent+'%';
            document.getElementById('result-details').textContent='You answered '+correct+' out of 25 correctly.';
            if(percent>=80){
                document.getElementById('result-score').className='result-score excellent';
                document.getElementById('result-icon').className='result-icon excellent';
                document.getElementById('result-icon').innerHTML='<span>🎉</span>';
            }else if(percent>=60){
                document.getElementById('result-score').className='result-score good';
                document.getElementById('result-icon').className='result-icon good';
                document.getElementById('result-icon').innerHTML='<span>👍</span>';
            }else{
                document.getElementById('result-score').className='result-score needs-work';
                document.getElementById('result-icon').className='result-icon needs-work';
                document.getElementById('result-icon').innerHTML='<span>📚</span>';
            }
            document.getElementById('stat-correct').textContent=correct;
            document.getElementById('stat-incorrect').textContent=25-correct;
            document.getElementById('stat-time').textContent=Math.floor(used/60)+':'+String(used%60).padStart(2,'0');
            document.getElementById('stat-score').textContent=correct;
        }
        function reviewAnswers(){const section=document.getElementById('review-section');section.style.display=section.style.display==='none'?'block':'none';if(section.style.display==='block'){section.innerHTML='<h3 style="margin-bottom:20px;">Question Review</h3>';questions.forEach((q,i)=>{const isCorrect=answers[i]===q.correct;            section.innerHTML+='<div class="review-item '+(isCorrect?'correct':'incorrect')+'"><div class="review-status '+(isCorrect?'correct':'incorrect')+'">'+[i+1]+'. '+(isCorrect?'Correct':'Incorrect')+'</div><p>'+q.text+'</p><p style="margin-top:10px;color:var(--text-muted);">Your answer: '+(answers[i]!==null?q.options[answers[i]]:'Not answered')+'</p>'+(isCorrect?'':'<p style="color:var(--secondary);margin-top:5px;">Correct: '+q.options[q.correct]+'</p>')+'</div>';});}
        }
        function retakeQuiz(){answers=new Array(25).fill(null);currentQ=0;quizSubmitted=false;timeRemaining=3600;document.getElementById('quiz-screen').style.display='block';document.getElementById('result-screen').classList.remove('show');createQuestionNav();updateProgress();displayQuestion(0);startTimer();}
        function exitQuiz(){window.location.href='myp4-algebra-study.html';}
        createQuestionNav();updateProgress();displayQuestion(0);startTimer();
    </script>
</body>
</html>
